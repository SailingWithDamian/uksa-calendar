name: Release
on: { push: { branches: [ main ] } }
jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate version
        id: version
        run: |
          echo "version=v$(git show -s --format=%ct)" >> $GITHUB_OUTPUT

  build-container:
    runs-on: ubuntu-latest
    needs: [setup]
    permissions:
      security-events: write
      packages: write
      pull-requests: write
    steps:
      - name: Build container using pack
        uses: infrabits/ci-pack@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          image: ghcr.io/${{ github.repository }}:${{ needs.setup.outputs.version }}
          use_builder: upstream
          runtime_release: ${{ needs.setup.outputs.version }}

  create-release:
    runs-on: ubuntu-latest
    needs: [setup, build-container]
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: infrabits/ci-create-missing-release@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: "${{ needs.setup.outputs.version }}"
