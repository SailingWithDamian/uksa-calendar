[project]
name = "uksa-calendar"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "icalendar",
    "httpx",
    "beautifulsoup4",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
tox = "*"
tox-current-env = "*"
black = "*"
ruff = "*"
bandit = "*"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
