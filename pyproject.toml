[project]
name = "uksa-calendar"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard] (>=0.162.0,<0.163.0)",
    "icalendar (>=7.3.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
tox = "^4.67.12"
tox-current-env = "^0.0.17"
black = "^26.10.1"
ruff = "^0.17.4"
bandit = "^1.9.4"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
